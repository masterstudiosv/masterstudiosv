<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de Estudio · Examen de Matemáticas 2026</title>
<style>
  :root{
    --bg: #14161a;
    --bg-panel: #1b1e24;
    --bg-panel-2: #21252c;
    --bg-code: #101216;
    --border: #2c313a;
    --text: #e4e6eb;
    --text-dim: #9aa1ac;
    --text-dimmer: #6c7280;
    --accent: #4fd1a5;
    --practice-bg: #1a2622;
    --practice-border: #2d4a3e;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(20,22,26,0.97);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:16px 20px;
  }
  header h1{
    margin:0 0 4px 0;
    font-size:1.25rem;
    font-weight:700;
    letter-spacing:0.2px;
  }
  header p.sub{
    margin:0 0 12px 0;
    color:var(--text-dim);
    font-size:0.85rem;
  }
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  #search{
    flex:1; min-width:180px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:8px;
    font-size:0.9rem;
    outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .btn{
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:9px 12px;
    border-radius:8px;
    font-size:0.82rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{color:var(--text); border-color:var(--accent);}

  main{max-width:900px; margin:0 auto; padding:18px 14px;}

  .toc{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-bottom:22px;
  }
  .toc a{
    text-decoration:none;
    font-size:0.78rem;
    padding:7px 12px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  .toc a:hover{color:var(--text); border-color:var(--text-dim);}

  .unidad{
    margin-bottom:26px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:var(--bg-panel);
  }
  .unidad-header{
    padding:14px 16px;
    display:flex; align-items:center; gap:10px;
    cursor:pointer;
    user-select:none;
  }
  .unidad-header .dot{
    width:10px; height:10px; border-radius:50%; flex-shrink:0;
  }
  .unidad-header h2{
    margin:0; font-size:1.02rem; flex:1;
  }
  .unidad-header .count{
    font-size:0.75rem; color:var(--text-dimmer);
    background:var(--bg-panel-2);
    padding:3px 9px; border-radius:12px;
  }
  .unidad-header .chev{
    color:var(--text-dimmer);
    transition:transform 0.2s;
    font-size:0.8rem;
  }
  .unidad.open .unidad-header .chev{transform:rotate(90deg);}
  .unidad-body{display:none;}
  .unidad.open .unidad-body{display:block;}

  .tema{
    border-top:1px solid var(--border);
  }
  .tema-header{
    padding:12px 16px 12px 30px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    user-select:none;
  }
  .tema-header:hover{background:var(--bg-panel-2);}
  .tema-header .idx{
    font-size:0.7rem; color:var(--text-dimmer);
    min-width:20px;
  }
  .tema-header h3{
    margin:0; font-size:0.9rem; font-weight:600; flex:1;
    color:var(--text);
  }
  .tema-header .chev{
    color:var(--text-dimmer); font-size:0.75rem;
    transition:transform 0.2s;
  }
  .tema.open .tema-header .chev{transform:rotate(90deg);}
  .tema-body{
    display:none;
    padding:4px 18px 22px 30px;
  }
  .tema.open .tema-body{display:block;}

  .explicacion{
    font-size:0.88rem;
    color:var(--text-dim);
    background:var(--bg-code);
    border-left:3px solid var(--accent);
    padding:10px 14px;
    border-radius:0 8px 8px 0;
    margin-bottom:16px;
  }

  .sec-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--text-dimmer);
    margin:16px 0 8px 0;
    font-weight:700;
  }

  .ejemplo{
    background:var(--bg-panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .ejemplo .num{
    display:inline-block;
    font-size:0.68rem;
    color:var(--bg);
    background:var(--accent);
    padding:2px 8px;
    border-radius:10px;
    font-weight:700;
    margin-bottom:6px;
  }
  .ejemplo .ctx{
    font-size:0.85rem;
    font-weight:600;
    color:var(--text);
    margin-bottom:4px;
  }
  .ejemplo .plan{
    font-size:0.84rem;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .ejemplo .sol{
    font-size:0.84rem;
    color:var(--text);
    background:var(--bg-code);
    border-radius:6px;
    padding:8px 10px;
    border:1px dashed var(--border);
  }
  .ejemplo .sol b{color:var(--accent);}

  .practica-item{
    background:var(--practice-bg);
    border:1px solid var(--practice-border);
    border-radius:8px;
    padding:11px 13px;
    margin-bottom:8px;
  }
  .practica-item .enun{
    font-size:0.85rem;
    margin-bottom:6px;
  }
  .practica-item .toggle-resp{
    font-size:0.72rem;
    color:var(--accent);
    cursor:pointer;
    display:inline-block;
    user-select:none;
  }
  .practica-item .resp{
    display:none;
    margin-top:6px;
    font-size:0.82rem;
    color:var(--text-dim);
    padding-top:6px;
    border-top:1px dashed var(--practice-border);
  }
  .practica-item.show .resp{display:block;}
  .practica-item.show .toggle-resp{color:var(--text-dimmer);}

  mark{
    background:#4fd1a5; color:#0c0f0d; border-radius:3px; padding:0 2px;
  }

  .hidden-by-search{display:none !important;}

  footer{
    text-align:center;
    color:var(--text-dimmer);
    font-size:0.75rem;
    padding:30px 20px 10px;
  }

  @media (max-width:600px){
    header h1{font-size:1.05rem;}
    .tema-header{padding-left:20px;}
    .tema-body{padding-left:20px;}
  }
</style>
</head>
<body>

<header>
  <h1>📐 Guía de Estudio — Examen de Matemáticas 2026</h1>
  <p class="sub">45 temas del temario · 4 ejemplos de la vida real por tema · ejercicios de práctica con respuesta oculta</p>
  <div class="toolbar">
    <input id="search" type="text" placeholder="Buscar un tema (ej: 'radicales', 'ley de senos', 'probabilidad')...">
    <button class="btn" id="expandAll">Abrir todo</button>
    <button class="btn" id="collapseAll">Cerrar todo</button>
  </div>
</header>

<main>
  <div class="toc" id="toc"></div>
  <div id="contenido"></div>
</main>

<footer>Guía generada a partir del temario propuesto para el examen 2026 · FGK</footer>

      explicacion: "La probabilidad clásica de un evento se calcula como: P(evento) = (número de resultados favorables) / (número total de resultados posibles), asumiendo que todos los resultados son igual de probables. El resultado siempre está entre 0 y 1 (o entre 0% y 100%).",
      ejemplos: [
        {ctx:"Probabilidad de ganar un sorteo de rifa", plan:"Se venden 200 boletos de rifa y compras 5. ¿Cuál es la probabilidad de que ganes el premio?", sol:"P = 5/200 = 1/40 = 0.025 = 2.5% de probabilidad de ganar."},
        {ctx:"Probabilidad de sacar una carta específica de una baraja", plan:"De una baraja estándar de 52 cartas, ¿cuál es la probabilidad de sacar un As?", sol:"Hay 4 ases en 52 cartas: P = 4/52 = 1/13 ≈ 7.69%."},
        {ctx:"Probabilidad de que un producto defectuoso salga en un control de calidad", plan:"En un lote de 500 productos hay 15 defectuosos. Si se elige uno al azar para inspección, ¿cuál es la probabilidad de que sea defectuoso?", sol:"P = 15/500 = 0.03 = 3% de probabilidad."},
        {ctx:"Probabilidad de acertar una pregunta de opción múltiple al adivinar", plan:"Una pregunta tiene 4 opciones y solo una es correcta. Si un estudiante adivina al azar, ¿cuál es la probabilidad de acertar?", sol:"P = 1/4 = 0.25 = 25% de probabilidad de acertar."}
      ],
      practica: [
        {enun:"Se lanza un dado. ¿Cuál es la probabilidad de obtener un número par?", resp:"3/6=1/2=50%"},
        {enun:"En una urna hay 8 bolas rojas y 12 azules. ¿Cuál es la probabilidad de sacar una roja al azar?", resp:"8/20=2/5=40%"},
        {enun:"En una clase de 30 estudiantes, 18 son mujeres. ¿Cuál es la probabilidad de elegir al azar a un hombre?", resp:"12/30=2/5=40%"}
      ]
    }
  ]
};


const UNIDADES = [UNIDAD_ARITMETICA, UNIDAD_ALGEBRA, UNIDAD_ECUACIONES, UNIDAD_FUNCIONES, UNIDAD_TRIGONOMETRIA, UNIDAD_PROBABILIDAD];

const toc = document.getElementById('toc');
const contenido = document.getElementById('contenido');

UNIDADES.forEach((unidad, uIdx) => {
  const uId = 'unidad-' + uIdx;

  // TOC link
  const a = document.createElement('a');
  a.href = '#' + uId;
  a.textContent = unidad.nombre;
  a.style.borderColor = unidad.color + '55';
  toc.appendChild(a);

  // Unidad container
  const uDiv = document.createElement('div');
  uDiv.className = 'unidad';
  uDiv.id = uId;

  const uHeader = document.createElement('div');
  uHeader.className = 'unidad-header';
  uHeader.innerHTML = `
    <span class="dot" style="background:${unidad.color}"></span>
    <h2>${unidad.nombre}</h2>
    <span class="count">${unidad.temas.length} temas</span>
    <span class="chev">▶</span>
  `;
  uHeader.addEventListener('click', () => uDiv.classList.toggle('open'));
  uDiv.appendChild(uHeader);

  const uBody = document.createElement('div');
  uBody.className = 'unidad-body';

  unidad.temas.forEach((tema, tIdx) => {
    const tDiv = document.createElement('div');
    tDiv.className = 'tema';
    tDiv.dataset.search = (tema.titulo + ' ' + tema.explicacion).toLowerCase();

    const tHeader = document.createElement('div');
    tHeader.className = 'tema-header';
    tHeader.innerHTML = `
      <span class="idx">${tIdx+1}.</span>
      <h3>${tema.titulo}</h3>
      <span class="chev">▶</span>
    `;
    tHeader.addEventListener('click', () => tDiv.classList.toggle('open'));
    tDiv.appendChild(tHeader);

    const tBody = document.createElement('div');
    tBody.className = 'tema-body';

    const exp = document.createElement('div');
    exp.className = 'explicacion';
    exp.textContent = tema.explicacion;
    tBody.appendChild(exp);

    const labelEj = document.createElement('div');
    labelEj.className = 'sec-label';
    labelEj.textContent = '🌍 Ejemplos en la vida real';
    tBody.appendChild(labelEj);

    tema.ejemplos.forEach((ej, i) => {
      const eDiv = document.createElement('div');
      eDiv.className = 'ejemplo';
      eDiv.innerHTML = `
        <span class="num">EJEMPLO ${i+1}</span>
        <div class="ctx">${ej.ctx}</div>
        <div class="plan">${ej.plan}</div>
        <div class="sol"><b>Solución:</b> ${ej.sol}</div>
      `;
      tBody.appendChild(eDiv);
    });

    const labelPr = document.createElement('div');
    labelPr.className = 'sec-label';
    labelPr.textContent = '✏️ Para practicar';
    tBody.appendChild(labelPr);

    tema.practica.forEach((pr) => {
      const pDiv = document.createElement('div');
      pDiv.className = 'practica-item';
      pDiv.innerHTML = `
        <div class="enun">${pr.enun}</div>
        <span class="toggle-resp">Mostrar respuesta ▾</span>
        <div class="resp">${pr.resp}</div>
      `;
      const toggle = pDiv.querySelector('.toggle-resp');
      toggle.addEventListener('click', () => {
        pDiv.classList.toggle('show');
        toggle.textContent = pDiv.classList.contains('show') ? 'Ocultar respuesta ▴' : 'Mostrar respuesta ▾';
      });
      tBody.appendChild(pDiv);
    });

    tDiv.appendChild(tBody);
    uBody.appendChild(tDiv);
  });

  uDiv.appendChild(uBody);
  contenido.appendChild(uDiv);
});

// Búsqueda
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.tema').forEach(tDiv => {
    const match = q === '' || tDiv.dataset.search.includes(q);
    tDiv.classList.toggle('hidden-by-search', !match);
    if (q !== '' && match) tDiv.classList.add('open');
    if (q === '') tDiv.classList.remove('open');
  });
  document.querySelectorAll('.unidad').forEach(uDiv => {
    const anyVisible = uDiv.querySelectorAll('.tema:not(.hidden-by-search)').length > 0;
    uDiv.style.display = (q !== '' && !anyVisible) ? 'none' : '';
    if (q !== '' && anyVisible) uDiv.classList.add('open');
    if (q === '') uDiv.classList.remove('open');
  });
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('.unidad').forEach(u => u.classList.add('open'));
  document.querySelectorAll('.tema').forEach(t => t.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('.unidad').forEach(u => u.classList.remove('open'));
  document.querySelectorAll('.tema').forEach(t => t.classList.remove('open'));
});

// Abrir la primera unidad por defecto
document.querySelector('.unidad').classList.add('open');
</script>
</body>
</html>
