        * {

            padding: 0;

        }

        body {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            background: #fafaf8;
            color: #2c2c2c;
            line-height: 1.8;
        }

        .header {
            position: relative;
            height: 450px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&h=600&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .header-logo {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        .header-subtitle {
            font-size: 1.3rem;
            font-style: italic;
            color: #d4af37;
            letter-spacing: 3px;
            font-weight: 300;
        }

        .header-line {
            width: 200px;
            height: 1px;
            background: #d4af37;
            margin: 1.5rem 0;
        }

        .search-filter-section {
            background: white;
            padding: 2.5rem 1rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            top: 0;
            z-index: 100;
        }

        .search-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: block;
            padding: 1.2rem 2rem;
            font-size: 1.05rem;
            border: 1px solid #d4af37;
            border-radius: 2px;
            background: #fafaf8;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #b8941f;
            background: white;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .filter-btn {
            padding: 0.9rem 2rem;
            border: 1px solid #2c2c2c;
            background: transparent;
            color: #2c2c2c;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #2c2c2c;
            color: white;
        }

        .filter-btn.active {
            background: #2c2c2c;
            color: #d4af37;
            border-color: #2c2c2c;
        }

        .menu-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2.5rem;
        }

        .menu-item {
            background: white;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
            position: relative;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .special-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #d4af37;
            color: white;
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 10;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .item-image-container {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .menu-item:hover .item-image {
            transform: scale(1.08);
        }

        .item-content {
            padding: 2rem 1.8rem;
        }

        .item-category {
            font-size: 0.85rem;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .item-title {
            font-size: 1.8rem;
            color: #2c2c2c;
            margin-bottom: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .item-description {
            color: #666;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .item-price {
            font-size: 1.8rem;
            color: #d4af37;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .ingredients-btn {
            background: transparent;
            color: #2c2c2c;
            border: 1px solid #2c2c2c;
            padding: 0.7rem 1.8rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ingredients-btn:hover {
            background: #2c2c2c;
            color: white;
        }

        .ingredients-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .ingredients-modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 3rem;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { 
                transform: translateY(50px);
                opacity: 0;
            }
            to { 
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-modal {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: transparent;
            color: #2c2c2c;
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 2rem;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            color: #d4af37;
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 2.2rem;
            color: #2c2c2c;
            margin-bottom: 0.5rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .modal-category {
            font-size: 0.9rem;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .ingredients-title {
            font-size: 1.2rem;
            color: #d4af37;
            margin: 2rem 0 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .ingredients-list {
            list-style: none;
            padding: 0;
        }

        .ingredients-list li {
            padding: 0.8rem 0;
            border-bottom: 1px solid #f0f0f0;
            color: #555;
            font-size: 1.05rem;
        }

        .ingredients-list li:last-child {
            border-bottom: none;
        }

        .no-results {
            text-align: center;
            padding: 5rem 2rem;
            color: #999;
            font-style: italic;
            grid-column: 1 / -1;
            font-size: 1.3rem;
        }

        @media (max-width: 1024px) {
            .menu-container {

            }

            .menu-container {
                grid-template-columns: 1fr;
                padding: 0 1rem 2rem;
            }

            .filters {
                gap: 0.5rem;
            }

            .filter-btn {
                padding: 0.8rem 1.2rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

        let currentFilter = 'all';
        let searchTerm = '';

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            let filteredItems = [...menuItems];

            if (searchTerm) {
                filteredItems = filteredItems.filter(item => 
                    item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    item.description.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (currentFilter !== 'all') {
                if (currentFilter === 'spécialité') {
                    filteredItems = filteredItems.filter(item => item.special === 'spécialité');
                } else if (currentFilter === 'plat du jour') {
                    filteredItems = filteredItems.filter(item => item.special === 'plat du jour');
                } else {
                    filteredItems = filteredItems.filter(item => item.category === currentFilter);
                }
            }

            if (filteredItems.length === 0) {
                container.innerHTML = '<div class="no-results">Aucun plat trouvé avec les critères sélectionnés</div>';
                return;
            }

            container.innerHTML = filteredItems.map(item => `
                <div class="menu-item">
                    ${item.special === 'spécialité' ? '<div class="special-badge">Spécialité Maison</div>' : ''}
                    ${item.special === 'plat du jour' ? '<div class="special-badge">Plat du Jour</div>' : ''}
                    <div class="item-image-container">
                        <img src="${item.image}" alt="${item.name}" class="item-image">
                    </div>
                    <div class="item-content">
                        <p class="item-category">${getCategoryName(item.category)}</p>
                        <h3 class="item-title">${item.name}</h3>
                        <p class="item-description">${item.description}</p>
                        <div class="item-footer">
                            <span class="item-price">${item.price.toFixed(2)} €</span>
                            <button class="ingredients-btn" onclick="showIngredients(${item.id})">
                                Ingrédients
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getCategoryName(category) {
            const names = {
                'entrées': 'Entrée',
                'plats': 'Plat Principal',
                'poissons': 'Poisson',
                'viandes': 'Viande',
                'desserts': 'Dessert',
                'boissons': 'Boisson'
            };
            return names[category] || category;
        }

        function showIngredients(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            const modal = document.getElementById('ingredientsModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalCategory = document.getElementById('modalCategory');
            const modalDescription = document.getElementById('modalDescription');
            const ingredientsList = document.getElementById('ingredientsList');

            modalTitle.textContent = item.name;
            modalCategory.textContent = getCategoryName(item.category);
            modalDescription.textContent = item.description;
            ingredientsList.innerHTML = item.ingredients.map(ing => `<li>${ing}</li>`).join('');
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('ingredientsModal').classList.remove('active');
        }

        document.getElementById('ingredientsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderMenu();
            });
        });

        document.getElementById('searchBox').addEventListener('input', function(e) {
            searchTerm = e.target.value;
            renderMenu();
        });

        renderMenu();
    </script>
